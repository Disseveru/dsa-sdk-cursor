# Release Drafter (manual fallback)
#
# Prefer Cursor for repo automation. This workflow is manual-only because
# GitHub Actions billing may block automatic runs on this account.

name: Release Drafter

on:
  workflow_dispatch:

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
