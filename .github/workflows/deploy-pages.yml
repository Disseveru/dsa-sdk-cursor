# Build and deploy run in Cursor Cloud Agents — see AGENTS.md and .github/CI.md
#
# This workflow is manual-only. Do not re-enable push triggers unless GitHub Actions billing is restored.

name: Deploy to GitHub Pages (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate WalletConnect secret
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: |
          test -n "$VITE_WALLETCONNECT_PROJECT_ID" || {
            echo "Missing VITE_WALLETCONNECT_PROJECT_ID" >&2
            exit 1
          }

      - name: Install and build
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
